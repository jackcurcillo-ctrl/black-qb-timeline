-09-11", "Sept. 11, 1989", "Other", "Randall Cunningham on the SI cover", "Headlined “The Ultimate Weapon.”"], ["1990-12-31", "1990", "Football events", "Warren Moon: AP Offensive Player of the Year", "The first Black QB I found with the award. Undrafted in 1978, Moon starred in the CFL, then entered the Hall of Fame in 2006."], ["1999-04-17", "Apr. 17, 1999", "Other", "Eagles fans boo Donovan McNabb", "Drafted second overall, McNabb is booed at the draft."], ["2000-06-01", "2000", "Other", "Dixon & Linz study of local TV news", "Black people were overrepresented as criminals and white people as police on Los Angeles–area news (Journal of Communication)."], ["2001-04-21", "Apr. 21, 2001", "Football events", "Michael Vick drafted No. 1", "The first Black QB taken first overall."], ["2003-09-28", "Sept. 28, 2003", "Other", "Rush Limbaugh on McNabb", "On ESPN, he says the media wants a Black QB to do well. He resigns."], ["2003-12-31", "2003", "Football events", "Steve McNair is co-MVP", "Shares the AP MVP with Peyton Manning, the first Black QB to win it. Cam Newton (2015) is the first to win it outright."], ["2007-02-04", "Feb. 4, 2007", "Football events", "Tony Dungy wins Super Bowl XLI", "The first Black head coach to win a Super Bowl. Dungy was a college QB, went undrafted, and was moved to defense."], ["2010-01-01", "2010", "Other", "Mercurio & Filak: framing of Black and white QBs", "Across 4,745 descriptions, Black QBs were described by physical gifts and white QBs by mental preparation."], ["2017-10-01", "2017", "Other", "Quillian et al.: hiring discrimination meta-analysis", "No decline in hiring discrimination against Black applicants over 25 years (PNAS)."], ["2018-04-26", "Apr. 26, 2018", "Football events", "Lamar Jackson drafted 32nd", "The Heisman winner falls to the last pick of round one after critics suggest he switch to receiver."], ["2019-12-31", "2019", "Football events", "Lamar Jackson wins unanimous MVP", "He wins MVP again in 2023."], ["2023-02- const PATCH={s0:`Black players banned from the league until 1946. `,s2:`The Supreme Court rules school segregation unconstitutional.`,s3:`Bans discrimination in public places and employment. Briscoe’s first start comes just four years later.`,s5:`Completed in 1970. This is significant because it marks the beginning of the modern era of American Football.`,s6:`Tennessee State’s Dickey is the first Black QB taken in the first round (25th, Raiders). He is moved to receiver and never plays QB as a pro. Out of the league after two short seasons. He died in 2000.`,s7:`Six months before Briscoe’s first start, the leader of the civil rights movement is assassinated.`,s8:`Denver beats Cincinnati 10–7. Drafted as a defensive back despite being an outstanding quarterback in college, Briscoe throws 14 TDs that year but is traded and converted to receiver.`,s9:`With the AFL’s Bills, Harris is the first Black QB to open a season as the starter. James "Shack" Harris was a significant historical figure, ending his 10-year career with 25 wins as a starter, and even won a playoff game in his time. What makes it all more impressive is that during this time, Harris was the only quarterback representing the black community. Despite all his success, he is repeatedly benched for white quarterbacks.`,s10:`The USC QB is the first instance of a black QB on a Sports Illustrated cover.`,s11:`Jimmy Jones leads an all-Black USC backfield in Birmingham. After being blown out by USC, Alabama fans loosened their hold on white supremacy on the football field, paving the way for more Southern schools to recruit black players.`,s13:`Undefeated at Toledo (35–0) but undrafted, and asked to play defensive back, Ealey goes to the Canadian Football League and wins the championship as a rookie, the first Black QB to do so.`,s14:`The first Black QB to start an opener in the NFL. He goes 4–1–1, but is still benched for Terry Bradshaw. He died in 2000.`,s16:`Doug Williams (Buccaneers) vs. Vince Evans (Bears).`,s17:`Ronald Reagan gets elected in the midst of this, a conservative president who was unsupportive of racial inclusion.`,s18:`Warren Moon’s beats J.C. Watts 26–23 in the CFL championship, the first pro title game with two Black starting QBs. The NFL did not match it until 2023.`,s19:`Tampa Bay paid Williams $120,000, the lowest of any starting QB, despite his stellar performance. After being disrespected during contract negotiations following that season, he left and went to the USFL for a few years.`,s20:`Doug Williams returns to the NFL in spectacular fashion, leading the then Washington Redskins to the Super Bowl and earning Super Bowl MVP after throwing for 4 touchdowns and over 300 yards. Proved those who denied him the money he deserved in Tampa wrong.`,s22:`Warren Moon was a star in college. He went undrafted in 1978 after NFL GMs asked him to switch positions. After winning five straight championships, the Oilers finally gave him a shot in the NFL, where he was spectacular, winning the first OPOY by a black quarterback.`,s23:`Drafted second overall, McNabb is booed at the draft.`,s25:`The first Black QB taken first overall.`,s26:`On ESPN, he says the media wants a Black QB to do well. He resigns.`,s27:`Shares the MVP with Peyton Manning, the first Black QB to win it. Cam Newton (2015) is the first to win it outright.`,s28:`The first Black head coach to win a Super Bowl. Dungy was a college QB, went undrafted, and was moved to defense.`,s29:`Across 4,745 descriptions, Black QBs were described by physical gifts and white QBs by mental preparation.`,s30:`Showed no decline in hiring discrimination against Black applicants over 25 years.`,s31:`The Heisman winner falls to the last pick of round one after critics suggest he switch to receiver, largely in part due to his skin color.`,s32:`Lamar wins his first MVP in just his second season (unanimously). He would go on to win another in 2023`,s33:`Mahomes vs. Hurts, the first Super Bowl with two Black starting QBs.`};
